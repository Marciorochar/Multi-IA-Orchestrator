[project]
name = "multi-ia-orchestrator"
version = "0.1.0"
description = "Controlled multi-agent orchestration core"
requires-python = ">=3.12"

[project.optional-dependencies]
gui = ["PySide6>=6.11,<7"]

[project.scripts]
multi-ia = "multi_ia.cli:entrypoint"
multi-ia-gui = "multi_ia.gui.app:entrypoint"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
